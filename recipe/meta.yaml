{% set name = "soupsieve" %}
{% set version = "2.9.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4a55d8cf158a9c2e587fa4922f1bbb91d68ac829e2d6f25403a85747c71daf74

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - hatchling >=1.26
    - pip
    - python
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - soupsieve
    - bs4
  requires:
    - pip
    - beautifulsoup4
    - pytest
  commands:
    - pip check
    - pytest -vv tests

about:
  home: https://github.com/facelessuser/soupsieve
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: A modern CSS selector implementation for BeautifulSoup
  description: |
    Soup Sieve is a CSS selector library designed to be used with Beautiful Soup 4.
    It aims to provide selecting, matching, and filtering using modern CSS selectors.
    Soup Sieve currently provides selectors from the CSS level 1 specifications up
    through the latest CSS level 4 drafts and beyond (though some are not yet implemented).
  dev_url: https://github.com/facelessuser/soupsieve
  doc_url: https://facelessuser.github.io/soupsieve/

extra:
  recipe-maintainers:
    - jschueller
